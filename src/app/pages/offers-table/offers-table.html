@if (!offers()) {
    Empty offers
} @else {
    <table mat-table [dataSource]="offers()" matSort (matSortChange)="announceSortChange($event)"
           class="mat-elevation-z8">

        <!-- Position Column -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by id">
                ID.
            </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="product">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by product">
                Product
            </th>
            <td mat-cell *matCellDef="let element"> {{element.product}} </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by price">
                Price
            </th>
            <td mat-cell *matCellDef="let element"> {{element.price}} </td>
        </ng-container>

        <!-- Volume Column -->
        <ng-container matColumnDef="volume">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by volume">
                Volume
            </th>
            <td mat-cell *matCellDef="let element"> {{element.volume}} </td>
        </ng-container>
        <!-- updatedAt Column -->
        <ng-container matColumnDef="updatedAt">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by updatedAt">
                UpdatedAt
            </th>
            <td mat-cell *matCellDef="let element"> {{element.updatedAt}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
}
